name: Export Room Schemas

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to export schemas from"
        required: true
        type: string

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up bun (web-ui deps)
        uses: oven-sh/setup-bun@v2

      - name: Set up pnpm (web-ui deps)
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Export schemas via KSP
        run: ./gradlew :app:kspDebugKotlin --stacktrace

      - name: Upload schemas
        uses: actions/upload-artifact@v4
        with:
          name: schemas-${{ inputs.ref }}
          path: app/schemas/
          if-no-files-found: error
