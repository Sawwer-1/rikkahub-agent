name: Release Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The build's Gradle toolchain requests a vendor-specific JetBrains Runtime 21
      # ({languageVersion=21, vendor=JetBrains, implementation=vendor-specific}).
      # The foojay resolver path currently fails server-side (HTTP 400 on the
      # provisioning redirect), so provision JBR 21 directly and expose it to
      # Gradle via the JAVA_HOME_21_X64 env var (mirrors unit-tests.yml).
      - name: Set up JetBrains Runtime 21 (toolchain)
        uses: actions/setup-java@v4
        with:
          distribution: 'jetbrains'
          java-version: '21'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 2026-10-14 吸收自 xiwangone/rikkahub-agents：与 unit-tests.yml 共用同一组 key，
      # 这样 UT 与发版两条流可以互相复用依赖缓存与构建缓存。
      - name: Cache Gradle modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-modules-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-modules-

      - name: Cache Gradle build cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/build-cache-1
          key: ${{ runner.os }}-gradle-buildcache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-gradle-buildcache-

      - name: Cache web-ui dependencies
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-webui-${{ hashFiles('web-ui/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-webui-

      - name: Prepare build files
        run: |
          # 解码base64编码的keystore文件
          echo "${{ secrets.KEY_BASE64 }}" | base64 -d > app/app.key
          
          # 写入签名配置到local.properties
          echo "${{ secrets.SIGNING_CONFIG }}" > local.properties
          
          # 写入Google Services配置
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Gradle Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --parallel --build-cache -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: artifacts
          path: app/build/outputs/apk/release/*.apk
