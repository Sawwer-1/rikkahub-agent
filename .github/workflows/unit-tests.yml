name: Unit Tests

on:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The build's Gradle toolchain requests a vendor-specific JetBrains Runtime 21
      # ({languageVersion=21, vendor=JetBrains, implementation=vendor-specific}).
      # The foojay resolver path currently fails server-side ("Package id not found"
      # on the provisioning redirect), so provision JBR 21 directly and expose it to
      # Gradle via the JAVA_HOME_21_X64 env var (see the gradle invocation below).
      - name: Set up JetBrains Runtime 21 (toolchain)
        uses: actions/setup-java@v4
        with:
          distribution: 'jetbrains'
          java-version: '21'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 2026-10-14 吸收自 xiwangone/rikkahub-agents：缓存拆三块 + key 精准化。
      # 旧 key 用 '**/*.gradle*'，任何构建脚本改动都会让整份依赖缓存失效，命中率极低；
      # modules-2 的 key 只跟版本目录与 wrapper 走（依赖实际由 libs.versions.toml 决定）。
      - name: Cache Gradle modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-modules-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-modules-

      # 构建缓存单独缓存、key 带 sha 兜底：跨提交复用编译产物，只影响时长不影响正确性。
      - name: Cache Gradle build cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/build-cache-1
          key: ${{ runner.os }}-gradle-buildcache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-gradle-buildcache-

      - name: Cache web-ui dependencies
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-webui-${{ hashFiles('web-ui/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-webui-

      - name: Prepare build files
        run: |
          echo "${{ secrets.KEY_BASE64 }}" | base64 -d > app/app.key
          echo "${{ secrets.SIGNING_CONFIG }}" > local.properties
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Run JVM unit tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --continue --stacktrace --no-configuration-cache --parallel --build-cache -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/**

      - name: Upload lint report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results*.html
