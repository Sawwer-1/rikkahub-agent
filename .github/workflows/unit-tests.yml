name: Unit Tests

on:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The build's Gradle toolchain requests a vendor-specific JetBrains Runtime 21
      # ({languageVersion=21, vendor=JetBrains, implementation=vendor-specific}).
      # The foojay resolver path currently fails server-side ("Package id not found"
      # on the provisioning redirect), so provision JBR 21 directly and expose it to
      # Gradle via the JAVA_HOME_21_X64 env var (see the gradle invocation below).
      - name: Set up JetBrains Runtime 21 (toolchain)
        uses: actions/setup-java@v4
        with:
          distribution: 'jetbrains'
          java-version: '21'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Prepare build files
        run: |
          echo "${{ secrets.KEY_BASE64 }}" | base64 -d > app/app.key
          echo "${{ secrets.SIGNING_CONFIG }}" > local.properties
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Run JVM unit tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --continue --stacktrace -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/**

      - name: Upload lint report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results*.html
